name: Build & Release

# Κάθε push στο main: έλεγχος + build (τα αρχεία στα Artifacts του run).
# Tag v* (π.χ. v1.6.0) ή «Run workflow» με release=true: δημιουργεί GitHub Release με όλα τα αρχεία.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Δημιουργία Release (με tag από την έκδοση της εφαρμογής)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  desktop-pi:
    name: Desktop (.pyw) + Raspberry Pi
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Έκδοση
        id: ver
        run: |
          V=$(grep -m1 -oP '^APP_VERSION = "\K[^"]+' desktop/AirSense.pyw)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Έκδοση εφαρμογής: $V"

      - name: Έλεγχος κώδικα
        run: |
          python -m py_compile desktop/AirSense.pyw pi/airsense_wifi.py remote/AirSense_Remote.pyw
          python tools/embed_remote.py --check
          bash -n pi/install_pi.sh
          for f in linux/*.sh linux/airsense; do bash -n "$f"; done
          sh -n linux/airsense-password.sh
          # the one-line installer must be the same everywhere
          cmp linux/get.sh get.sh && cmp linux/get.sh luckfox/get.sh && cmp linux/get.sh pi/get.sh
          # ο headless server (Raspberry Pi) πρέπει να ξεκινά χωρίς εξωτερικές βιβλιοθήκες
          timeout 60 python desktop/AirSense.pyw --help-cli
          timeout 60 python desktop/AirSense.pyw --data "$RUNNER_TEMP/as" --status

      - name: Πακέτα
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist AirSense-Pi AirSense-Luckfox
          cp desktop/AirSense.pyw "dist/AirSense_v$V.pyw"
          RV=$(grep -m1 -oP '^APP_VERSION = "\K[^"]+' remote/AirSense_Remote.pyw)
          cp remote/AirSense_Remote.pyw "dist/AirSense_Remote_v$RV.pyw"     # Windows: manage the board over SSH
          # Raspberry Pi: common Linux scripts + WiFi tool + Pi docs
          cp linux/* AirSense-Pi/
          cp pi/airsense_wifi.py pi/install_pi.sh pi/install_from_windows.bat pi/ODIGIES_Raspberry_Pi.md AirSense-Pi/
          cp desktop/AirSense.pyw "AirSense-Pi/AirSense_v$V.pyw"
          # Luckfox: common Linux scripts + Luckfox docs
          cp linux/* AirSense-Luckfox/
          cp luckfox/install_from_windows.bat luckfox/ODIGIES_Luckfox.md AirSense-Luckfox/
          cp desktop/AirSense.pyw "AirSense-Luckfox/AirSense_v$V.pyw"
          chmod 755 AirSense-*/*.sh AirSense-*/airsense
          zip -qr "dist/AirSense-Pi_v$V.zip" AirSense-Pi
          zip -qr "dist/AirSense-Luckfox_v$V.zip" AirSense-Luckfox
          # fixed names for get.sh (releases/latest/download/…)
          cp "dist/AirSense-Pi_v$V.zip" dist/AirSense-Pi.zip
          cp "dist/AirSense-Luckfox_v$V.zip" dist/AirSense-Luckfox.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AirSense-desktop-pi
          path: dist/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Κλειδί υπογραφής (προαιρετικό — από GitHub Secrets)
        env:
          KS_B64: ${{ secrets.AIRSENSE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/airsense.jks"
            echo "AIRSENSE_KEYSTORE=$RUNNER_TEMP/airsense.jks" >> "$GITHUB_ENV"
            echo "✔ Υπογραφή με το δικό σου κλειδί"
          else
            echo "ℹ Δεν υπάρχει AIRSENSE_KEYSTORE_B64 → υπογραφή debug"
          fi

      - name: Screenshots (Robolectric — UI check, does not block the APK)
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "gr.nikkpap.airsense.ScreensTest"

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: |
            android/app/build/shots/*.png
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build APK
        env:
          AIRSENSE_KEYSTORE_PASSWORD: ${{ secrets.AIRSENSE_KEYSTORE_PASSWORD }}
          AIRSENSE_KEY_ALIAS: ${{ secrets.AIRSENSE_KEY_ALIAS }}
          AIRSENSE_KEY_PASSWORD: ${{ secrets.AIRSENSE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p ../dist
          if [ -n "${AIRSENSE_KEYSTORE:-}" ]; then
            # με δικό σου κλειδί → υπογεγραμμένο release (κανονικές ενημερώσεις)
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/*.apk "../dist/AirSense-Android_v$V.apk"
          else
            # χωρίς κλειδί → debug APK (εγκαθίσταται κανονικά· για ενημέρωση ίσως θέλει απεγκατάσταση)
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk "../dist/AirSense-Android_v$V-debug.apk"
          fi
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: AirSense-android
          path: dist/*.apk

  release:
    name: GitHub Release
    needs: [desktop-pi, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Σημειώσεις έκδοσης
        run: |
          V=${{ needs.desktop-pi.outputs.version }}
          awk -v v="$V" '
            $0 ~ "^## v"v"( |$)" {p=1; next}
            p && /^## v/ {exit}
            p {print}' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "AirSense v$V" > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Αρχεία**
          - `AirSense_vX.pyw` — Windows: διπλό κλικ (εγκαθιστά μόνο του ό,τι χρειάζεται).
          - `AirSense_Remote_vX.pyw` — Windows: διαχείριση της πλακέτας (Raspberry Pi / Luckfox) μέσω SSH με γραφικό περιβάλλον.
          - `AirSense-Pi_vX.zip` — Raspberry Pi (Zero 2 W/3/4/5) server — μία εντολή: `wget -qO get.sh https://raw.githubusercontent.com/nikkpap/AirSense/main/get.sh && sudo bash get.sh`
          - `AirSense-Luckfox_vX.zip` — Luckfox Pico Pro/Max (Ubuntu) server — η ίδια εντολή (βρίσκει μόνη της την πλακέτα).
          - `AirSense-Android_vX.apk` — εφαρμογή Android (υπογεγραμμένη).

          Nikolaos K. Paridis (aka nikkpap) · ALU DEV TEAM
          EOF
          ls -la dist

      - name: Signed APK → drop the -debug / older APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.desktop-pi.outputs.version) }}
          if ls dist/AirSense-Android_v*.apk 2>/dev/null | grep -qv -- '-debug'; then
            rm -f dist/*-debug.apk
            # also from the release: -debug and older APK versions (the app OTA takes the newest)
            NEW=$(basename "$(ls dist/AirSense-Android_v*.apk | grep -v -- '-debug' | head -1)")
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -E '^AirSense-Android_v.*\.apk$' | grep -vx "$NEW" | while read -r A; do
              gh release delete-asset "$TAG" "$A" -R "$GITHUB_REPOSITORY" -y && echo "✔ removed $A"
            done
          fi
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.desktop-pi.outputs.version) }}
          name: AirSense v${{ needs.desktop-pi.outputs.version }}
          body_path: notes.md
          files: dist/*
          make_latest: true
